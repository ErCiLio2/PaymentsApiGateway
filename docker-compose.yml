services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kashe
      POSTGRES_USER: kashe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kashe}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  kashe:
    build: ./services/kashe
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://kashe:${POSTGRES_PASSWORD:-kashe}@postgres:5432/kashe?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_KEY: ${PROXYPAY_API_KEY:-dev-proxypay-key}
      POS_ID: ${PROXYPAY_POS_ID:-1}
      PROXYPAY_WEBHOOK_SECRET: ${PROXYPAY_WEBHOOK_SECRET}
      BASE_URL: ${KASHE_BASE_URL:-http://localhost:8080}
      WEB_URL: ${WEB_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@kashe.dev}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_KEY: ${ADMIN_KEY:-admin}
    ports:
      - "${KASHE_HOST_PORT:-8080}:8080"
    depends_on:
      - postgres
      - redis

  web:
    build: ./web
    restart: unless-stopped
    environment:
      PORT: "3000"
      PROXYPAY_API_URL: http://kashe:8080
    depends_on:
      - kashe

volumes:
  postgres_data:
  redis_data:
