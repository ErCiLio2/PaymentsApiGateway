services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  proxypay:
    build: ./services/proxypay
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      API_KEY: ${PROXYPAY_API_KEY:-dev-proxypay-key}
      POS_ID: ${PROXYPAY_POS_ID:-1}
      WEBHOOK_SECRET: ${PROXYPAY_WEBHOOK_SECRET}
      BASE_URL: ${PROXYPAY_BASE_URL:-http://localhost:8080}
      WEB_URL: ${WEB_URL:-http://localhost:3001}
    ports:
      - "${PROXYPAY_HOST_PORT:-8080}:8080"
    depends_on:
      - redis

  web:
    build: ./web
    restart: unless-stopped
    environment:
      PORT: "3000"
      PROXYPAY_API_URL: http://proxypay:8080
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - proxypay

volumes:
  redis_data:
